name: NEXLINK Windows Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend tests with real PostgreSQL and Redis
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: nexlink
          POSTGRES_DB: nexlink
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nexlink -d nexlink"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: testing
      DATABASE_URL: postgresql+asyncpg://nexlink@127.0.0.1:5432/nexlink
      REDIS_URL: redis://127.0.0.1:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
      - name: Generate an ephemeral test signing key
        run: |
          key="$(python -c 'import secrets; print(secrets.token_urlsafe(48))')"
          echo "::add-mask::$key"
          echo "JWT_SECRET_KEY=$key" >> "$GITHUB_ENV"
      - name: Install backend and client test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt
      - name: Compile and run the complete backend test suite
        working-directory: backend
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -m compileall -q app ../nexlink_agent ../nexlink_ai
          python -m pytest -q

  windows-build:
    name: Build and smoke-test Windows x64 bundles
    runs-on: windows-latest
    needs: backend-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: "x64"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            requirements-windows.txt
            requirements-windows-build.txt
      - name: Create and activate the Python 3.12 x64 virtual environment
        shell: pwsh
        run: |
          python -m venv .venv
          (Join-Path $PWD '.venv\Scripts') | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Install runtime, test, and PyInstaller dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-windows-build.txt
          python -m pip install -r backend/requirements.txt
      - name: Generate an ephemeral Windows test signing key
        shell: pwsh
        run: |
          $key = python -c 'import secrets; print(secrets.token_urlsafe(48))'
          Write-Output "::add-mask::$key"
          "JWT_SECRET_KEY=$key" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Run Windows-safe existing tests
        working-directory: backend
        env:
          APP_ENV: testing
          DATABASE_URL: postgresql+asyncpg://nexlink@127.0.0.1:5432/nexlink
          PYTHONPATH: ${{ github.workspace }}
          REDIS_URL: redis://127.0.0.1:6379/0
        run: python -m pytest -q tests/test_agent_urls.py tests/test_agent_identity.py tests/test_ed25519.py
      - name: Build, PE-verify, smoke-test, and package all three ZIPs
        shell: pwsh
        run: .\BUILD_NEXLINK_WINDOWS.ps1
      - name: Upload NEXLINK-Client-Windows.zip
        uses: actions/upload-artifact@v4
        with:
          name: NEXLINK-Client-Windows
          path: dist/NEXLINK-Client-Windows.zip
          if-no-files-found: error
          retention-days: 30
      - name: Upload NEXLINK-Server-Windows.zip
        uses: actions/upload-artifact@v4
        with:
          name: NEXLINK-Server-Windows
          path: dist/NEXLINK-Server-Windows.zip
          if-no-files-found: error
          retention-days: 30
      - name: Upload NEXLINK-Windows-Bundle.zip
        uses: actions/upload-artifact@v4
        with:
          name: NEXLINK-Windows-Bundle
          path: dist/NEXLINK-Windows-Bundle.zip
          if-no-files-found: error
          retention-days: 30
