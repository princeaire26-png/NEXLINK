services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: nexlink
      POSTGRES_PASSWORD: nexlink_dev
      POSTGRES_DB: nexlink
    ports:
      - "127.0.0.1:${NEXLINK_POSTGRES_PORT:-55432}:5432"
    volumes:
      - nexlink_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexlink -d nexlink"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:${NEXLINK_REDIS_PORT:-56379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  nexlink_pgdata:
